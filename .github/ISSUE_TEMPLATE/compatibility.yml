name: How an app works
description: Tell others how an app (or website) works in Parallex — good or bad.
title: "App name: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Reports like this one tell the next person what to expect before they make a copy.
        From the Parallex app, an instance's ⋯ menu › **Report How It Works…** fills in the details below, or run `parallex report <name>`.
  - type: dropdown
    id: result
    attributes:
      label: How does it work?
      options:
        - Works great
        - Works, with some problems
        - Doesn't work
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: The app, its version, how the instance was made, and your Parallex and macOS versions.
      placeholder: |
        App: Slack 4.41.105 (com.tinyspeck.slackmacgap)
        Made as: own-identity copy, separate Library
        Parallex: 0.16.0
        macOS: 26.1 (arm64)
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: What happened
      description: What works, what doesn't, and anything you did to make it work. Sign-in, notifications, calls, updates?
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: This report doesn't include anything private (account names, file paths, screenshots of messages).
          required: true

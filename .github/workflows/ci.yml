name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS 26, and macOS 27 (GitHub names that image after its Xcode).
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sw_vers && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: App bundle
        run: make app
